  <a href="https://github.com/kvcache-ai/Mooncake/pull/2599" target="_blank">
    <rect class="merged" x="488" y="461" width="158" height="96" rx="10"/>
    <text class="node-title" x="502" y="483">#2599</text>
    <text class="node-sha" x="502" y="501">077b696</text>
