  <rect class="panel" x="30" y="780" width="1025" height="360" rx="14"/>
  <text class="panel-title" x="52" y="813">Observed Community Solution Tendency</text>
  <text class="small-note" x="52" y="836">Observed facts are solid boxes. The final dashed branch is an architectural inference, not an accepted upstream plan.</text>

  <rect x="65" y="864" width="275" height="105" rx="12" fill="#eff8ff" stroke="#2e90fa" stroke-width="2"/>
  <text class="trend-title" x="82" y="890">1 · Keep one authority efficient</text>
  <text class="trend-text" x="82" y="914">Batch by key/shard, reduce key count,</text>
  <text class="trend-text" x="82" y="933">bound candidate and queue memory,</text>
  <text class="trend-text" x="82" y="952">use 1,024 in-process shards.</text>

  <line class="edge" x1="340" y1="916" x2="378" y2="916" marker-end="url(#arrow)"/>

  <rect x="390" y="864" width="275" height="105" rx="12" fill="#f4f3ff" stroke="#7a5af8" stroke-width="2"/>
  <text class="trend-title" x="407" y="890">2 · Separate pressure signals</text>
  <text class="trend-text" x="407" y="914">Measure metadata RPC vs data I/O;</text>
  <text class="trend-text" x="407" y="933">separate probe from read lease;</text>
  <text class="trend-text" x="407" y="952">make failure and backlog visible.</text>

  <line class="edge" x1="665" y1="916" x2="703" y2="916" marker-end="url(#arrow)"/>

  <rect x="715" y="864" width="305" height="105" rx="12" fill="#ecfdf3" stroke="#12b76a" stroke-width="2"/>
  <text class="trend-title" x="732" y="890">3 · Improve eviction and holder I/O</text>
  <text class="trend-text" x="732" y="914">Create eviction headroom, pace work,</text>
  <text class="trend-text" x="732" y="933">parallelize independent bucket writes,</text>
  <text class="trend-text" x="732" y="952">preserve partial-failure semantics.</text>

  <a href="https://github.com/kvcache-ai/Mooncake/issues/990" target="_blank">
    <rect class="issue" x="65" y="1001" width="450" height="100" rx="12"/>
    <text class="trend-title" x="82" y="1027">Community discussion · Issue #990</text>
    <text class="trend-text" x="82" y="1051">Current advice: batch operations, reduce physical key granularity,</text>
    <text class="trend-text" x="82" y="1070">benchmark first, and scale up the single Master when sufficient.</text>
    <text class="trend-text" x="82" y="1089">The issue closed without a multi-master implementation.</text>
  </a>

  <a href="https://github.com/kvcache-ai/Mooncake/issues/1035" target="_blank">
    <rect class="design" x="545" y="991" width="475" height="120" rx="12"/>
    <text class="trend-title" x="562" y="1017">Conditional trajectory · active Master partitioning</text>
    <text class="trend-text" x="562" y="1041">Only after metrics prove Master CPU, RPC, locks, or metadata memory</text>
    <text class="trend-text" x="562" y="1060">remain limiting. No accepted active multi-master PR/RFC was found.</text>
    <text class="trend-text" x="562" y="1079">V3 roadmap key routing serves Router lookup; it does not specify</text>
    <text class="trend-text" x="562" y="1098">distributed Master ownership, fencing, recovery, or rebalancing.</text>
  </a>

  <rect class="panel" x="1080" y="95" width="490" height="1045" rx="14"/>
  <text class="panel-title" x="1102" y="128">Recommended Reading Path</text>
  <text class="small-note" x="1102" y="151">Read cause → merged mechanism → open trajectory.</text>
  <line x1="1125" y1="181" x2="1125" y2="1050" stroke="#d0d5dd" stroke-width="3"/>

  <circle class="step-number" cx="1125" cy="190" r="17"/><text class="step-digit" x="1125" y="195">1</text>
  <text class="step-title" x="1154" y="185">Frame the production symptom</text>
  <text class="step-text" x="1154" y="205">Issue #3452: cardinality, eviction RSS, HA.</text>

  <circle class="step-number" cx="1125" cy="285" r="17"/><text class="step-digit" x="1125" y="290">2</text>
  <text class="step-title" x="1154" y="280">Read the primary OOM fix</text>
  <text class="step-text" x="1154" y="300">#3118: O(N) census, selective identities, reserve.</text>

  <circle class="step-number" cx="1125" cy="380" r="17"/><text class="step-digit" x="1125" y="385">3</text>
  <text class="step-title" x="1154" y="375">Read the HA amplifier pair</text>
  <text class="step-text" x="1154" y="395">#3154 → #3168: capacity gauge ownership.</text>

  <circle class="step-number" cx="1125" cy="475" r="17"/><text class="step-digit" x="1125" y="480">4</text>
  <text class="step-title" x="1154" y="470">Close residual RSS retention</text>
  <text class="step-text" x="1154" y="490">#3576: sparse map bucket shrink thresholds.</text>

  <circle class="step-number" cx="1125" cy="570" r="17"/><text class="step-digit" x="1125" y="575">5</text>
  <text class="step-title" x="1154" y="565">Establish the key lookup baseline</text>
  <text class="step-text" x="1154" y="585">SGLang adapter notes → #2508 batch lookup.</text>

  <circle class="step-number" cx="1125" cy="665" r="17"/><text class="step-digit" x="1125" y="670">6</text>
  <text class="step-title" x="1154" y="660">Follow L3 demotion mechanics</text>
  <text class="step-text" x="1154" y="680">#2286 → #2599 → #2690.</text>

  <circle class="step-number" cx="1125" cy="760" r="17"/><text class="step-digit" x="1125" y="765">7</text>
  <text class="step-title" x="1154" y="755">Separate bottleneck classes</text>
  <text class="step-text" x="1154" y="775">#3643 latency phases → #3801 probe semantics.</text>

  <circle class="step-number" cx="1125" cy="855" r="17"/><text class="step-digit" x="1125" y="860">8</text>
  <text class="step-title" x="1154" y="850">Read the open pressure controls</text>
  <text class="step-text" x="1154" y="870">#3014, #3226, #3788, and #3805.</text>

  <circle class="step-number" cx="1125" cy="950" r="17"/><text class="step-digit" x="1125" y="955">9</text>
  <text class="step-title" x="1154" y="945">Evaluate the routing trajectory</text>
  <text class="step-text" x="1154" y="965">#3589 → issue #990 → V3 roadmap #1035.</text>

  <rect x="1103" y="1010" width="440" height="95" rx="10" fill="#fff6ed" stroke="#fb6514" stroke-width="2"/>
  <text class="trend-title" x="1120" y="1036">Decision gate</text>
  <text class="trend-text" x="1120" y="1059">If Master control-plane load dominates after steps 1–8,</text>
  <text class="trend-text" x="1120" y="1078">prototype static ownership partitioning. If SSD IOPS or</text>
  <text class="trend-text" x="1120" y="1097">payload bandwidth dominates, multi-master will not fix it.</text>
</svg>
