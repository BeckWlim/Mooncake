  <rect class="panel" x="30" y="385" width="1025" height="375" rx="14"/>
  <text class="panel-title" x="52" y="418">Lane B · SGLang L3 Full → Metadata, Eviction, and Offload Pressure</text>
  <text class="small-note" x="52" y="441">Merged foundation above; open community proposals below. A batch RPC is not necessarily end-to-end work coalescing.</text>

  <line class="edge" x1="143" y1="510" x2="990" y2="510" marker-end="url(#arrow)"/>
  <circle cx="130" cy="510" r="8" fill="#667085"/>
  <text class="lane-label" x="52" y="506">main</text>

  <a href="https://github.com/kvcache-ai/Mooncake/pull/2508" target="_blank">
    <rect class="merged" x="142" y="461" width="158" height="96" rx="10"/>
    <text class="node-title" x="156" y="483">#2508</text>
    <text class="node-sha" x="156" y="501">3c3b01b</text>
    <text class="node-text" x="156" y="524">group batch lookup</text>
