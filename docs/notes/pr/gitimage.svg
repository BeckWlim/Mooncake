     role="img" aria-labelledby="title description">
  <title id="title">Mooncake Master OOM and SGLang L3 pressure PR reading graph</title>
  <description id="description">
    Two-lane Git and pull-request graph showing merged Master OOM fixes,
    merged and open SGLang L3 pressure work, the observed community solution
    tendency, and a numbered reading path.
  </description>

  <defs>
    <style>
      .canvas { fill: #f7f9fc; }
