      text { font-family: Inter, Arial, sans-serif; }
      .panel-title { font-size: 20px; font-weight: 700; fill: #182230; }
      .header { font-size: 30px; font-weight: 700; fill: #101828; }
      .subheader { font-size: 15px; font-weight: 400; fill: #475467; }
      .lane-label { font-size: 15px; font-weight: 700; fill: #344054; }
      .node-title { font-size: 14px; font-weight: 700; fill: #182230; }
      .node-text { font-size: 12px; font-weight: 400; fill: #475467; }
      .node-sha { font-family: monospace; font-size: 11px; font-weight: 600; fill: #344054; }
      .merged { fill: #ecfdf3; stroke: #12b76a; stroke-width: 2; }
      .open { fill: #fffaeb; stroke: #f79009; stroke-width: 2; stroke-dasharray: 7 5; }
      .issue { fill: #f4f3ff; stroke: #7a5af8; stroke-width: 2; }
      .design { fill: #f2f4f7; stroke: #667085; stroke-width: 2; stroke-dasharray: 8 6; }
      .edge { fill: none; stroke: #667085; stroke-width: 2.5; }
      .branch { fill: none; stroke: #98a2b3; stroke-width: 2; stroke-dasharray: 5 5; }
      .trend-title { font-size: 15px; font-weight: 700; fill: #182230; }
      .trend-text { font-size: 12px; font-weight: 400; fill: #475467; }
      .step-number { fill: #175cd3; }
      .step-digit { font-size: 13px; font-weight: 700; fill: #ffffff; text-anchor: middle; }
      .step-title { font-size: 14px; font-weight: 700; fill: #182230; }
      .step-text { font-size: 12px; font-weight: 400; fill: #475467; }
      .legend { font-size: 12px; font-weight: 500; fill: #475467; }
      .small-note { font-size: 11px; font-weight: 400; fill: #667085; }
      a:hover rect { stroke-width: 3; }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3"
            orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#667085"/>
    </marker>
    <marker id="arrow-light" markerWidth="10" markerHeight="10" refX="9" refY="3"
            orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#98a2b3"/>
    </marker>
  </defs>

